name: hardened
description: "Hardened TDD workflow with diff mutation analysis, survived mutant elimination, and adversarial review for core features"
stages:
  - id: red-phase
    role: "Test Author"
    directive: "Author Red test suite derived from spec.md acceptance criteria and prove red failure."
    allow: ["tests/**", "**/*.test.*", "**/*.spec.*", "**/specs/**", "**/__tests__/**"]
    claims:
      - id: red-tests-fail
        tool: make
        target: test-package
        expect: "red"

  - id: green-phase
    role: "Code Implementer"
    directive: "Implement minimal clean production code to turn tests green without editing test files."
    deny: ["tests/**", "**/*.test.*", "**/*.spec.*", "**/specs/**", "**/__tests__/**"]
    claims:
      - id: green-tests-pass
        tool: make
        target: check-package
        expect_exit: 0

  - id: mutation-gate
    role: "Mutation Runner"
    directive: "Execute mutation testing on diff and surface survived mutants."
    claims:
      - id: diff-mutation
        tool: mutation
        mode: diff

  - id: adversarial-review
    role: "Adversarial Reviewer"
    directive: "Break the implementation using intent.md invariants and eliminate all survived mutants."
    claims:
      - id: adversarial-audit
        tool: critic
        runner: auto
        checks:
          - "Intent check & non-goals respected"
          - "Zero survived mutants"

  - id: gatekeeper
    role: "Gatekeeper"
    directive: "Verify all task claims in done.yaml."
    claims: []
